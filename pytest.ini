[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

addopts = 
    --strict-markers
    --html=tests/reports/report.html
    --self-contained-html
    --capture=no
    -v

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    e2e: End-to-end integration and user workflow tests
    crawler: Automatic application crawler and link/asset integrity tests
    auth: User registration, authentication, and profile tests
    catalog: Catalog, search, product detail, and wishlist tests
    checkout: Cart, coupon, and payment checkout flow tests
    reviews: Product review, rating, and Q&A tests
    dashboard: Staff dashboard and admin panel tests
