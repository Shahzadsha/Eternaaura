{% extends "dashboard/base.html" %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-panel border border-red-500/30 rounded-xl p-8 text-center">
  <h2 class="font-serif text-xl text-white mb-3">{{ title }}</h2>
  <p class="text-sm text-gray-400 mb-6">This can't be undone.</p>
  <form method="post" class="flex gap-3 justify-center">
    {% csrf_token %}
    <a href="{{ cancel_url }}" class="px-5 py-2 rounded-lg border border-white/10 text-sm text-gray-300 hover:bg-white/5">Cancel</a>
    <button type="submit" class="px-5 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm font-medium">Delete</button>
  </form>
</div>
{% endblock %}
