{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 md:px-8 py-16">
  <h1 class="font-serif text-3xl mb-8">My Wishlist</h1>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
    {% for item in wishlist_items %}
      {% with product=item.product %}{% include "partials/product_card.html" %}{% endwith %}
    {% empty %}
      <p class="text-ink/50 col-span-full">Your wishlist is empty.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
