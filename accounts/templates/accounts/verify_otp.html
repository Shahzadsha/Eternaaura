{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-20 text-center">
  <h1 class="font-serif text-3xl mb-4">Verify Your Account</h1>
  <p class="text-ink/60 mb-8">Enter the 6-digit OTP sent to your email.</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <input name="code" maxlength="6" class="w-full text-center tracking-[0.5em] text-2xl border border-ink/15 rounded-lg py-3">
    <button class="w-full bg-ink text-cream py-3 rounded-full font-medium hover:bg-gold hover:text-ink transition-colors">Verify</button>
  </form>
  <a href="{% url 'accounts:resend_otp' %}" class="block mt-6 text-sm text-ink/60 hover:text-gold underline">Didn't get a code? Resend it</a>
</div>
{% endblock %}
