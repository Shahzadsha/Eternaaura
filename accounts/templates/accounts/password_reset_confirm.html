{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-20">
  <h1 class="font-serif text-3xl mb-8 text-center">Set New Password</h1>

  {% if validlink %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-medium text-ink/60 uppercase mb-1">New Password</label>
      <input type="password" name="password1" required placeholder="New Password" class="w-full border border-ink/15 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gold">
    </div>
    <div>
      <label class="block text-xs font-medium text-ink/60 uppercase mb-1">Confirm New Password</label>
      <input type="password" name="password2" required placeholder="Confirm New Password" class="w-full border border-ink/15 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gold">
    </div>
    <button type="submit" class="w-full bg-ink text-cream py-3 rounded-full font-medium hover:bg-gold hover:text-ink transition-colors">
      Reset Password
    </button>
  </form>
  {% else %}
  <div class="text-center space-y-4">
    <p class="text-red-600 text-sm">The password reset link is invalid or has expired.</p>
    <a href="{% url 'accounts:password_reset' %}" class="inline-block px-6 py-2.5 bg-ink text-cream text-xs rounded-full hover:bg-gold hover:text-ink transition-colors">
      Request a New Link
    </a>
  </div>
  {% endif %}
</div>
{% endblock %}
