{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-20">
  <h1 class="font-serif text-3xl mb-8 text-center">Reset Password</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <input type="email" name="email" placeholder="Your email" class="w-full border border-ink/15 rounded-lg px-4 py-3">
    <button class="w-full bg-ink text-cream py-3 rounded-full font-medium hover:bg-gold hover:text-ink transition-colors">Send Reset Link</button>
  </form>
</div>
{% endblock %}
