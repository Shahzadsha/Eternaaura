{% load static %}
<header class="sticky top-0 z-50 bg-ink/95 backdrop-blur border-b border-gold/30 w-full">
  <div class="w-full px-4 sm:px-5 md:px-6">
    <div class="flex items-center justify-between h-16 sm:h-20">

      <!-- Left Group: Hamburger Button (Flush at Far-Left Edge) + MENU Label + Logo -->
      <div class="flex items-center gap-2 sm:gap-4 shrink-0">
        <!-- Hamburger Menu Button (Absolute Far Left, 16–20px from Screen Edge) -->
        <button @click="offcanvasOpen = true" aria-label="Open Navigation Menu"
          class="flex items-center gap-2 py-2 pr-1 rounded-full text-gold-light hover:text-white transition-colors focus:outline-none cursor-pointer shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
          <span
            class="font-accent text-base sm:text-lg md:text-2xl tracking-widest uppercase font-semibold text-gold-light">Menu</span>

        </button>

        <!-- Logo -->
        <a href="{% url 'catalog:home' %}"
          class="font-serif text-xl sm:text-2xl md:text-3xl tracking-[0.15em] sm:tracking-[0.2em] text-cream ml-1 sm:ml-2">
          ETERNA<span class="text-gold-light">AURA</span>
        </a>
      </div>

      <!-- Desktop nav -->
      <nav class="hidden lg:flex items-center gap-8 font-accent text-lg text-cream/90">
        <a href="{% url 'catalog:category_detail' slug='necklaces' %}"
          class="hover:text-gold-light transition-colors">Necklaces</a>
        <a href="{% url 'catalog:category_detail' slug='rings' %}"
          class="hover:text-gold-light transition-colors">Rings</a>
        <a href="{% url 'catalog:category_detail' slug='earrings' %}"
          class="hover:text-gold-light transition-colors">Earrings</a>
        <a href="{% url 'catalog:collection_detail' slug='bridal-collection' %}"
          class="hover:text-gold-light transition-colors">Bridal</a>
        <a href="{% url 'coupons:list' %}" class="hover:text-gold-light transition-colors">Offers</a>
      </nav>

      <!-- Right icons -->
      <div class="flex items-center gap-3 sm:gap-5 text-cream">
        <button @click="searchOpen = !searchOpen" aria-label="Search"
          class="p-1.5 hover:text-gold-light transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m21 21-5.2-5.2m0 0a7.5 7.5 0 1 0-10.6-10.6 7.5 7.5 0 0 0 10.6 10.6Z" />
          </svg>
        </button>
        <a href="{% url 'accounts:wishlist' %}" aria-label="Wishlist"
          class="relative p-1.5 hover:text-gold-light transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
          </svg>
          {% if user.is_authenticated %}
          <span data-wishlist-count-badge
            class="{% if not wishlist_count %}hidden{% endif %} absolute -top-1 -right-1 bg-gold text-ink text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">{{ wishlist_count|default:0 }}</span>
          {% endif %}
        </a>

        <a href="{% url 'cart:detail' %}" aria-label="Cart"
          class="relative p-1.5 hover:text-gold-light transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 1.994-4.694 2.602-7.163a1.125 1.125 0 0 0-1.11-1.337H5.106M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
          </svg>
          <span data-cart-count-badge
            class="{% if not cart_item_count %}hidden{% endif %} absolute -top-1 -right-1 bg-gold text-ink text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">{{ cart_item_count|default:0 }}</span>
        </a>

        {% if user.is_authenticated %}
        <a href="{% url 'accounts:profile' %}" aria-label="Account"
          class="p-1.5 hover:text-gold-light transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
        </a>
        {% else %}
        <a href="{% url 'accounts:login' %}" aria-label="Login"
          class="p-1.5 hover:text-gold-light transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
        </a>
        {% endif %}

      </div>
    </div>

    <!-- Search bar (toggle overlay) -->
    <div x-show="searchOpen" x-transition class="pb-4" style="display:none">
      <form action="{% url 'catalog:search' %}" method="get" class="flex items-center shadow-lg">
        <input type="text" name="q" placeholder="Search necklaces, rings, earrings…"
          class="w-full rounded-l-full px-4 sm:px-5 py-2.5 bg-cream text-ink text-sm focus:outline-none">
        <button type="submit"
          class="rounded-r-full px-4 sm:px-6 py-2.5 bg-gold text-ink font-medium text-sm hover:bg-gold-light transition-colors shrink-0">Search</button>
      </form>
    </div>
  </div>
</header>

<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
