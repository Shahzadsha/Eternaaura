<form method="get" action="{{ request.path }}" id="sortForm" class="flex items-center gap-2">
  <label for="sortSelect" class="text-xs sm:text-sm font-medium text-ink/70 shrink-0">Sort by:</label>
  <select id="sortSelect" name="sort"
          onchange="this.form.submit()"
          class="bg-white border border-gold/30 rounded-xl px-3 py-1.5 text-xs sm:text-sm text-ink focus:outline-none focus:ring-1 focus:ring-gold cursor-pointer">
    <option value="newest" {% if current_sort == 'newest' or not current_sort %}selected{% endif %}>Newest First (New Arrivals)</option>
    <option value="oldest" {% if current_sort == 'oldest' %}selected{% endif %}>Oldest First</option>
    <option value="best_sellers" {% if current_sort == 'best_sellers' %}selected{% endif %}>Best Sellers</option>
    <option value="trending" {% if current_sort == 'trending' %}selected{% endif %}>Trending</option>
    <option value="price_low" {% if current_sort == 'price_low' %}selected{% endif %}>Price: Low to High</option>
    <option value="price_high" {% if current_sort == 'price_high' %}selected{% endif %}>Price: High to Low</option>
    <option value="rating" {% if current_sort == 'rating' %}selected{% endif %}>Highest Rated</option>
    <option value="reviews" {% if current_sort == 'reviews' %}selected{% endif %}>Most Reviewed</option>
    <option value="name_asc" {% if current_sort == 'name_asc' or current_sort == 'name' %}selected{% endif %}>Name (A–Z)</option>
    <option value="name_desc" {% if current_sort == 'name_desc' %}selected{% endif %}>Name (Z–A)</option>
  </select>
  <button type="submit" class="text-xs bg-ink text-cream px-3 py-1.5 rounded-xl hover:bg-gold hover:text-ink transition-colors cursor-pointer">Sort</button>
  <script>
    (function(){
      var f = document.getElementById('sortForm');
      if (f) {
        var timer = null;
        f.submit = function() {
          var params = new URLSearchParams(new FormData(f)).toString();
          var target = (f.action || window.location.pathname) + '?' + params;
          if (timer) clearTimeout(timer);
          timer = setTimeout(function() {
            window.location.href = target;
          }, 50);
        };
      }
    })();
  </script>
</form>
